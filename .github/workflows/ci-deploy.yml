name: CI / Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes cancel superseded PR runs; runs on master are never cancelled mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + route tests
        run: npm test

      - name: Syntax-check frontend
        run: |
          node --check public/app.js
          node --check public/textlib.js

      # Bundles every Pages Function. Catches broken imports/exports before they reach production.
      - name: Bundle Pages Functions
        run: npx wrangler pages functions build --outdir "$RUNNER_TEMP/functions-out"

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    # Only from master, only after tests pass. Never from pull requests (so never from Dependabot).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Create an "production" environment in repo settings to add required reviewers (a manual gate) if you want one.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check deploy secrets
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so deploy was skipped. See README → CI/CD."

      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: npm ci

      - name: Deploy
        id: deploy
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=textshift --branch=master --commit-hash=${{ github.sha }} --commit-dirty=true

      # Fails the job (and tells you) if the site or the Functions are not answering after deploy.
      - name: Smoke test
        if: env.HAS_CLOUDFLARE_SECRETS == 'true' && steps.deploy.outputs.deployment-url != ''
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$URL/" | grep -q "TextShift"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 --retry-all-errors -X OPTIONS "$URL/api/tone")
          test "$code" = "204" || { echo "Functions check failed: HTTP $code"; exit 1; }
          echo "Deployed and healthy: $URL"
